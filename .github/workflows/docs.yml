name: Deploy docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get install -y graphviz
      - name: Generate rulegraph
        run: |
          set -euo pipefail
          mkdir -p data/processed/batches/batch_0
          touch data/processed/batches/batch_0/items.jsonl
          uv run snakemake --rulegraph --forceall all predict > rulegraph.dot
          test -s rulegraph.dot
          dot -Tsvg rulegraph.dot -o docs/assets/rulegraph.svg
          grep -q "<svg" docs/assets/rulegraph.svg
      - run: uv run --extra docs mkdocs gh-deploy --force