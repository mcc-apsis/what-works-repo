[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "what-works-repo"
description = ""
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "dvc[ssh]>=3.67.1",
  "loguru>=0.7.3",
  "snakemake>=9.24",
  "typer>=0.27.1",
]

[tool.hatch]
version.source = "vcs"
build.targets.wheel.packages = [
  "src/what-works-repo",
]

[tool.ruff]
lint.select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.ty]
environment.python-version = "3.14"
